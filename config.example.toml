# PodPdf Server Runtime Configuration
# Copy this file to config.toml:
#   cp config.example.toml config.toml

host = "0.0.0.0"
port = 8080

# 50 MB payload ceiling prevents unbounded memory allocation on large uploads
max_payload_size = 52428800

log_level = "info"

# Security & Authentication
# When true, all PDF tools strictly require a valid API key (X-API-Key: podpdf_...)
auth_enabled = true
auth_store_path = "data/auth_store.json"

# Custom HTTP Response Headers (injected into all server responses)
[custom_headers]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
