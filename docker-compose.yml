services:
  podpdf:
    image: sugoi13/podpdf:latest
    container_name: podpdf
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-${PORT:-8080}}:8080"
    env_file:
      - .env
    environment:
      # Hardened internal container port and host binding
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - ./data:/home/podpdf/data
    networks:
      - podpdf

networks:
  podpdf:
    driver: bridge
